name: Deploy demos

# Publishes to ux.effectory.com/prototypes/cyos/ (Azure Static Web Apps), which
# serves the main branch as-is, without a build step. The built site therefore
# lives in demo/ on main, and the root index.html forwards to it.
# MANUAL TRIGGER ONLY, and scoped: the target input decides which slice of
# demo/ is updated. Everything else in demo/ stays byte-identical, so
# publishing a research doc never touches the phase demos and vice versa.
#
#   site-and-research → landing page + research docs (site/ → demo/)
#   phase-1           → builds phase-1/ and replaces demo/phase-1/
#   phase-2           → builds phase-2/ and replaces demo/phase-2/
#   phase-2.1         → builds phase-2.1/ and replaces demo/phase-2.1/
#   phase-2.2         → builds phase-2.2/ and replaces demo/phase-2.2/
#   phase-2.3         → builds phase-2.3/ and replaces demo/phase-2.3/
#   phase-3           → builds phase-3/ and replaces demo/phase-3/
#   everything        → all of the above
#
# Never edit demo/ by hand. A phase built locally goes the same way: copy its
# dist/ to demo/<phase>/ and commit that to main.

on:
  workflow_dispatch:
    inputs:
      target:
        description: What to publish
        type: choice
        default: site-and-research
        options:
          - site-and-research
          - phase-1
          - phase-2
          - phase-2.1
          - phase-2.2
          - phase-2.3
          - phase-3
          - everything

permissions:
  contents: write

concurrency:
  group: deploy-demos
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        if: inputs.target == 'phase-1' || inputs.target == 'phase-2' || inputs.target == 'phase-2.1' || inputs.target == 'phase-2.2' || inputs.target == 'phase-2.3' || inputs.target == 'phase-3' || inputs.target == 'everything'
        with:
          node-version: 22
      - name: Update landing page and research docs
        if: inputs.target == 'site-and-research' || inputs.target == 'everything'
        run: |
          # Sync site/ into demo/, removing stale static files but never
          # touching the phase build folders.
          mkdir -p demo
          rsync -a --delete --exclude 'phase-1/' --exclude 'phase-2/' --exclude 'phase-2.1/' --exclude 'phase-2.2/' --exclude 'phase-2.3/' --exclude 'phase-3/' site/ demo/
      - name: Build and replace phase 1
        if: inputs.target == 'phase-1' || inputs.target == 'everything'
        run: |
          npm ci --prefix phase-1
          npm run build --prefix phase-1
          rm -rf demo/phase-1
          mkdir -p demo
          cp -R phase-1/dist demo/phase-1
          printf '{"commit":"%s","builtAt":"%s"}' "$GITHUB_SHA" "$(date -u +%FT%TZ)" > demo/phase-1/version.json
      - name: Build and replace phase 2
        if: inputs.target == 'phase-2' || inputs.target == 'everything'
        run: |
          npm ci --prefix phase-2
          npm run build --prefix phase-2
          rm -rf demo/phase-2
          mkdir -p demo
          cp -R phase-2/dist demo/phase-2
          printf '{"commit":"%s","builtAt":"%s"}' "$GITHUB_SHA" "$(date -u +%FT%TZ)" > demo/phase-2/version.json
      - name: Build and replace phase 2.1
        if: inputs.target == 'phase-2.1' || inputs.target == 'everything'
        run: |
          npm ci --prefix phase-2.1
          npm run build --prefix phase-2.1
          rm -rf demo/phase-2.1
          mkdir -p demo
          cp -R phase-2.1/dist demo/phase-2.1
          printf '{"commit":"%s","builtAt":"%s"}' "$GITHUB_SHA" "$(date -u +%FT%TZ)" > demo/phase-2.1/version.json
      - name: Build and replace phase 2.2
        if: inputs.target == 'phase-2.2' || inputs.target == 'everything'
        run: |
          npm ci --prefix phase-2.2
          npm run build --prefix phase-2.2
          rm -rf demo/phase-2.2
          mkdir -p demo
          cp -R phase-2.2/dist demo/phase-2.2
          printf '{"commit":"%s","builtAt":"%s"}' "$GITHUB_SHA" "$(date -u +%FT%TZ)" > demo/phase-2.2/version.json
      - name: Build and replace phase 2.3
        if: inputs.target == 'phase-2.3' || inputs.target == 'everything'
        run: |
          npm ci --prefix phase-2.3
          npm run build --prefix phase-2.3
          rm -rf demo/phase-2.3
          mkdir -p demo
          cp -R phase-2.3/dist demo/phase-2.3
          printf '{"commit":"%s","builtAt":"%s"}' "$GITHUB_SHA" "$(date -u +%FT%TZ)" > demo/phase-2.3/version.json
      - name: Build and replace phase 3
        if: inputs.target == 'phase-3' || inputs.target == 'everything'
        run: |
          npm ci --prefix phase-3
          npm run build --prefix phase-3
          rm -rf demo/phase-3
          mkdir -p demo
          cp -R phase-3/dist demo/phase-3
          printf '{"commit":"%s","builtAt":"%s"}' "$GITHUB_SHA" "$(date -u +%FT%TZ)" > demo/phase-3/version.json
      - name: Publish
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A demo
          git diff --cached --quiet && { echo "Nothing changed — nothing published."; exit 0; }
          git commit -m "Publish ${{ inputs.target }} ($GITHUB_SHA)"
          git push origin HEAD:main || { git pull --rebase origin main && git push origin HEAD:main; }
